  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
  /* Layout: built for iPhone Safari. Full-screen callout, fake iOS alert, phone-sized terminal with fake iOS banners, then a centered reveal card. Single committed dark look. */
  :root {
    --bg: #050806;
    --fg: #c8ffd0;
    --dim: #6f9e79;
    --hot: #36ff6a;
    --warn: #ffb347;
    --bad: #ff4d4d;
    --card: #0d140f;
    --pumpkin: #ff7a1a;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --display: "Rubik Glitch", "IBM Plex Mono", monospace;
    --ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { min-height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100dvh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }

  #intro { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-bottom: 8vh; }
  #intro .bro {
    font-family: var(--display); font-weight: 400; color: var(--bad);
    font-size: clamp(72px, 26vw, 160px); line-height: .9; margin: 0;
    animation: shake .35s steps(2) 3;
  }
  #intro .say { font-size: clamp(24px, 7vw, 40px); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; min-height: 1.2em; }
  #intro .say.red { color: var(--bad); }
  @keyframes shake {
    0% { transform: translate(0, 0); } 25% { transform: translate(-6px, 3px); }
    50% { transform: translate(5px, -4px); } 75% { transform: translate(-3px, -2px); } 100% { transform: translate(0, 0); }
  }

  #term { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; font-size: 17px; line-height: 1.45; }
  #term .l { display: block; margin-bottom: 2px; }
  #term .k { color: var(--dim); }
  #term .ts { font-size: 12px; }
  #term .ok { color: var(--hot); }
  #term .w { color: var(--warn); }
  #term .b { color: var(--bad); font-weight: 600; }
  #term .big { font-size: 20px; margin-top: 8px; }
  .cursor::after { content: "█"; animation: blink 1s steps(1) infinite; color: var(--hot); }
  @keyframes blink { 50% { opacity: 0; } }
  .bar { display: inline-block; width: min(240px, 58vw); height: 10px; border: 1px solid var(--dim); vertical-align: middle; margin-right: 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--hot); transition: width .25s linear; }
  .bar.store { width: min(180px, 44vw); }
  .bar.store i { width: 100%; clip-path: inset(0 100% 0 0); transition: clip-path .2s linear;
    background: linear-gradient(90deg, #ff453a 0 28%, #ffd60a 28% 58%, #30d158 58% 78%, #8e8e93 78%); }

  #flash { position: fixed; inset: 0; background: var(--bad); opacity: 0; pointer-events: none; z-index: 8; }
  #flash.go { animation: flash 1.1s steps(2) 3; }
  @keyframes flash { 0%,100% { opacity: 0; } 50% { opacity: .35; } }

  /* Fake iOS notification banners */
  #banners {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 8px; right: 8px; z-index: 20;
    max-width: 430px; margin: 0 auto; display: grid; gap: 8px; pointer-events: none; font-family: var(--ios);
  }
  .note {
    display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 22px; color: #fff;
    background: rgba(44,44,46,.82); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    transform: translateY(-140%); opacity: 0; transition: transform .45s cubic-bezier(.2,.9,.3,1.15), opacity .3s;
  }
  .note.in { transform: none; opacity: 1; }
  .note .ic { width: 38px; height: 38px; border-radius: 9px; flex: none; position: relative; display: grid; place-items: center; font-size: 22px; }
  .ic.msg { background: linear-gradient(#5df777, #0abd2b); }
  .ic.msg::after { content: ""; position: absolute; left: 7px; top: 9px; width: 24px; height: 19px; background: #fff; border-radius: 50%; }
  .ic.set { background: linear-gradient(#a3a3a8, #6e6e73); }
  .nb { flex: 1; min-width: 0; font-size: 15px; line-height: 1.3; }
  .nh { display: flex; justify-content: space-between; gap: 8px; }
  .nh b { font-weight: 600; }
  .nh span { color: rgba(255,255,255,.55); font-size: 13px; }

  /* Fake iOS permission alert */
  #alert {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
    background: rgba(0,0,0,.45); font-family: var(--ios); animation: fade .2s ease-out;
  }
  #alert .sheet {
    width: 270px; border-radius: 14px; overflow: hidden; color: #fff; text-align: center;
    background: rgba(44,44,46,.85); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    animation: pop .25s ease-out;
  }
  #alert .txt { padding: 19px 16px 18px; }
  #alert .t { font-size: 17px; font-weight: 600; line-height: 1.3; }
  #alert .m { font-size: 13px; line-height: 1.35; margin-top: 4px; }
  #alert .btns { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid rgba(255,255,255,.2); }
  #alert button { font: inherit; font-size: 17px; color: #0a84ff; background: none; border: 0; height: 44px; padding: 0 6px; white-space: nowrap; cursor: pointer; }
  #alert button + button { border-left: .5px solid rgba(255,255,255,.2); }
  @keyframes pop { from { transform: scale(1.15); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }

  #reveal {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 22px;
    padding-block: 24px;
  }
  /* Cracked glass + RGB glitch when DEVICE COMPROMISED hits */
  #crack { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  #crack svg { display: block; width: 100%; height: 100%; }
  body.glitch #term { animation: rgb .1s steps(2) infinite; }
  @keyframes rgb {
    0% { text-shadow: 2px 0 rgba(255,0,80,.85), -2px 0 rgba(0,255,255,.85); transform: translate(2px, -1px); }
    100% { text-shadow: -3px 0 rgba(255,0,80,.85), 3px 0 rgba(0,255,255,.85); transform: translate(-3px, 1px); }
  }

  /* Fake Messages thread (dark mode) */
  #imsg {
    position: fixed; inset: 0; z-index: 15; background: #000; color: #fff; font-family: var(--ios);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    animation: slidein .35s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slidein { from { transform: translateX(100%); } }
  .im-head { position: relative; display: flex; justify-content: center; padding: 10px 16px 8px; background: #1c1c1e; border-bottom: .5px solid #38383a; }
  .im-back { position: absolute; left: 12px; top: 18px; width: 13px; height: 13px; border-left: 3px solid #0a84ff; border-bottom: 3px solid #0a84ff; transform: rotate(45deg); border-radius: 1px; }
  .im-who { display: grid; justify-items: center; gap: 4px; }
  .im-av { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(#a5abb8, #858994); display: grid; place-items: center; font-size: 22px; font-weight: 600; }
  .im-name { font-size: 12px; }
  .im-name span { color: #8e8e93; }
  .im-thread { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 18px; overflow: hidden; }
  .im-stamp { text-align: center; color: #8e8e93; font-size: 11px; margin-bottom: auto; padding-top: 6px; line-height: 1.4; }
  .bub {
    position: relative; max-width: 75%; padding: 7px 13px; border-radius: 18px; font-size: 17px; line-height: 1.3; margin-top: 8px;
    animation: bub .28s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes bub { from { transform: scale(.5) translateY(12px); opacity: 0; } }
  .bub::before, .bub::after { content: ""; position: absolute; bottom: 0; height: 20px; }
  .bub.me { align-self: flex-end; background: #0a84ff; transform-origin: bottom right; }
  .bub.me::before { right: -7px; width: 20px; background: #0a84ff; border-bottom-left-radius: 16px 14px; }
  .bub.me::after { right: -26px; width: 26px; background: #000; border-bottom-left-radius: 10px; }
  .bub.them { align-self: flex-start; background: #26252a; transform-origin: bottom left; }
  .bub.them::before { left: -7px; width: 20px; background: #26252a; border-bottom-right-radius: 16px 14px; }
  .bub.them::after { left: -26px; width: 26px; background: #000; border-bottom-right-radius: 10px; }
  .im-status { align-self: flex-end; font-size: 11px; color: #8e8e93; margin-top: 3px; }
  .im-status b { font-weight: 600; }
  .typing { align-self: flex-start; background: #26252a; border-radius: 18px; padding: 12px 14px; display: flex; gap: 4px; margin-top: 8px; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; animation: dot 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }
  .im-compose { display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px; }
  .im-plus { width: 34px; height: 34px; border-radius: 50%; background: #2c2c2e; color: #a1a1a6; display: grid; place-items: center; font-size: 24px; font-weight: 300; flex: none; }
  .im-field { flex: 1; min-height: 36px; border: 1px solid #3a3a3c; border-radius: 18px; display: flex; align-items: center; padding: 0 4px 0 14px; font-size: 17px; }
  #im-input::after { content: ""; display: inline-block; width: 2px; height: 20px; margin-left: 1px; background: #0a84ff; vertical-align: -4px; animation: blink 1s steps(1) infinite; }
  .im-ph { color: #636366; }
  #im-input:not(:empty) + .im-ph { display: none; }
  .im-send { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; background: #0a84ff; display: grid; place-items: center; font-weight: 700; font-size: 17px; }

  /* Fake "iPhone Unavailable" lock screen */
  #locked {
    position: fixed; inset: 0; z-index: 25; font-family: var(--ios); color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 28px calc(env(safe-area-inset-bottom, 0px) + 28px);
    background: radial-gradient(120% 80% at 15% 5%, #3b2a6e, transparent 60%), radial-gradient(120% 90% at 95% 95%, #0f3d5e, transparent 60%), #07070b;
    animation: fade .4s ease-out;
  }
  .lk-mid { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 8px; }
  .lk-t { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
  .lk-s { font-size: 17px; color: rgba(255,255,255,.72); }
  .lk-foot { width: 100%; display: flex; justify-content: space-between; font-size: 17px; }

  #reveal .victim { color: var(--pumpkin); font-size: 17px; font-weight: 600; }
  #reveal h1 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(56px, 20vw, 140px); line-height: .9; margin: 0; color: var(--pumpkin);
    text-wrap: balance; letter-spacing: .02em;
  }
  #reveal p { margin: 0 auto; max-width: 34ch; color: var(--fg); font-size: 16px; text-wrap: balance; }
  #reveal .sub { color: var(--dim); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--dim); padding: 18px 20px; max-width: 420px; width: 100%; display: grid; gap: 12px; }
  .card .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; color: var(--dim); }
  .btn {
    display: inline-block; text-decoration: none; font: inherit; font-weight: 600;
    background: var(--hot); color: #04110a; padding: 12px 18px; border: 0; cursor: pointer;
  }
  .btn:focus-visible, .ghost:focus-visible { outline: 2px solid var(--pumpkin); outline-offset: 3px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row .btn { flex: 1; min-width: 120px; text-align: center; }

  @media (prefers-reduced-motion: reduce) {

    #flash.go { animation: none; }

  }
</style>
</head>

<script>
(function () {
  const intro = document.getElementById('intro');
  const term = document.getElementById('term');
  const reveal = document.getElementById('reveal');
  const flash = document.getElementById('flash');
  const banners = document.getElementById('banners');
  const alertEl = document.getElementById('alert');
  const themeColor = document.querySelector('meta[name="theme-color"]');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let running = false, nagged = false;

  function device() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
    if (/SM-|Samsung|SamsungBrowser/i.test(ua)) return 'Galaxy';
    if (/Pixel/.test(ua)) return 'Pixel';
    if (/Android/.test(ua)) return 'Android';
    if (/Mac/.test(ua)) return 'Mac';
    if (/Windows/.test(ua)) return 'PC';
    return 'phone';
  }
  // Safari hides the exact model, but screen size + pixel ratio narrows it to a family.
  function model() {
    if (!/iPhone/.test(navigator.userAgent)) return device();
    const w = Math.min(screen.width, screen.height), h = Math.max(screen.width, screen.height);
    return ({
      '320x568@2': 'iPhone SE (1st gen)',
      '375x667@2': 'iPhone SE / 8',
      '414x736@3': 'iPhone 8 Plus',
      '375x812@3': 'iPhone 13 mini / 12 mini / 11 Pro',
      '414x896@2': 'iPhone 11 / XR',
      '414x896@3': 'iPhone 11 Pro Max',
      '390x844@3': 'iPhone 14 / 13 / 12 / 16e',
      '428x926@3': 'iPhone 14 Plus / 13 Pro Max',
      '393x852@3': 'iPhone 16 / 15 / 15 Pro',
      '430x932@3': 'iPhone 16 Plus / 15 Pro Max',
      '402x874@3': 'iPhone 17 / 17 Pro / 16 Pro',
      '420x912@3': 'iPhone Air',
      '440x956@3': 'iPhone 17 Pro Max / 16 Pro Max',
    })[`${w}x${h}@${devicePixelRatio}`] || 'iPhone';
  }
  function browser() {
    const ua = navigator.userAgent;
    if (/SamsungBrowser/.test(ua)) return 'Samsung Internet';
    if (/Instagram|Snapchat|FBAN|FBAV/.test(ua)) return 'in-app browser';
    if (/CriOS|Chrome/.test(ua) && !/Edg/.test(ua)) return 'Chrome';
    if (/Safari/.test(ua) && !/Chrome|CriOS/.test(ua)) return 'Safari';
    if (/Firefox|FxiOS/.test(ua)) return 'Firefox';
    if (/Edg/.test(ua)) return 'Edge';
    return 'browser';
  }
  function language() {
    const l = navigator.language || 'en-US';
    try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(l); } catch (e) { return l; }
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const pad = n => String(n).padStart(2, '0');
  function stamp() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  const ts = () => `<span class="k ts">[${stamp()}]</span>`;
  const clock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const sleep = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 80) : ms));

  // Approximate city from IP, looked up once at load. Mobile carrier IPs can land a city or two off; any failure just skips the line.
  const placeP = (async () => {
    const sources = [
      ['https://ipapi.co/json/', d => d.city && [d.city, d.region]],
      ['https://ipwho.is/', d => d.success && d.city && [d.city, d.region]],
    ];
    for (const [url, pick] of sources) {
      try {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 3000);
        const r = await fetch(url, { signal: c.signal });
        clearTimeout(t);
        const v = pick(await r.json());
        if (v) return v[1] && v[1] !== v[0] ? `${v[0]}, ${v[1]}` : v[0];
      } catch (e) {}
    }
    return null;
  })();

  // Per-phone memory: visit count for the repeat-scan script, and this phone's victim number. Private tabs or blocked storage just act like a first visit.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const visits = (+store.get('boo-visits') || 0) + 1;
  store.set('boo-visits', visits);
  let repeat = visits > 1;

  // Victim counter (abacus.jasoncameron.dev). Each phone is counted once; if the service is down the line is skipped.
  const victimP = (async () => {
    const saved = store.get('boo-victim');
    if (saved) return saved;
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 4000);
      const r = await fetch('https://abacus.jasoncameron.dev/hit/boo-holtom-me/victims', { signal: c.signal });
      clearTimeout(t);
      const v = (await r.json()).value;
      if (v > 0) { store.set('boo-victim', v); return v; }
    } catch (e) {}
    return null;
  })();

  // Sound. iOS only allows audio after a tap, so this is unlocked from the fake alert's buttons.
  let ctx = null;
  function unlockAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) { ctx = null; }
  }
  // One oscillator gliding f0 -> f1. `hold` keeps it at full volume for that fraction of `dur` before fading; `lp` adds a low-pass filter.
  function sweep(f0, f1, at, dur, { type = 'sine', vol = .1, lp, hold = 0 } = {}) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + at;
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .01);
    if (hold) g.gain.setValueAtTime(vol, t + dur * hold);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let out = o;
    if (lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); out = f; }
    out.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  function noise(at, dur, vol, freq) {
    if (!ctx) return;
    const t = ctx.currentTime + at, len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(ctx.destination);
    s.start(t);
  }
  const pick = a => a[Math.floor(Math.random() * a.length)];
  // Data chirp per terminal line.
  function chirp() {
    const f = pick([1800, 2200, 2600, 3100]);
    sweep(f, f * .5, 0, .045, { vol: .06 });
    sweep(f * 1.5, f * 1.5, .05, .025, { type: 'square', vol: .015 });
  }
  // Progress blip, rising with the bar.
  const blip = p => sweep(420 + p * 14, 420 + p * 14, 0, .035, { type: 'triangle', vol: .035 });
  // iPhone-style notification ding, kept realistic on purpose.
  const ding = () => { sweep(1568, 1568, 0, .18, { vol: .18 }); sweep(2093, 2093, .12, .3, { vol: .15 }); };
  // Rising breach sweep when the hack starts.
  const breach = () => { sweep(180, 2400, 0, .5, { type: 'sawtooth', vol: .06, lp: 2600, hold: .6 }); sweep(90, 1200, .05, .5, { vol: .08, hold: .6 }); };
  // Boom + static + glitch stutter, then pulsing sci-fi sirens.
  function compromised() {
    [55, 55.6, 110].forEach(f => sweep(f, f * .6, 0, 2.4, { type: 'sawtooth', vol: .13, lp: 900, hold: .1 }));
    noise(0, .6, .3, 1400);
    for (let i = 0; i < 10; i++) sweep(200 + Math.random() * 2800, 120 + Math.random() * 300, .3 + i * .05, .04, { type: 'square', vol: .05 });
    for (let i = 0; i < 4; i++) sweep(360, 1150, .9 + i * .6, .48, { type: 'triangle', vol: .15, lp: 3000, hold: .75 });
  }
  const glass = () => { noise(0, .18, .4, 4500); noise(.03, .35, .2, 2200); };
  const keyClick = () => noise(0, .02, .06, 3500);
  const swoosh = () => { sweep(350, 1500, 0, .22, { vol: .08, hold: .2 }); noise(0, .2, .05, 2500); };
  const received = () => { sweep(1245, 1245, 0, .12, { vol: .12 }); sweep(1661, 1661, .09, .2, { vol: .1 }); };
  // Power-down drop before the reveal.
  const powerDown = () => sweep(900, 40, 0, 1.1, { type: 'sawtooth', vol: .09, lp: 1400, hold: .3 });

  // Haptics. Android has navigator.vibrate; iOS 18+ Safari ticks the Taptic Engine when a switch-style checkbox is toggled.
  function haptic() {
    try {
      const l = document.createElement('label'), i = document.createElement('input');
      i.type = 'checkbox'; i.setAttribute('switch', '');
      l.style.display = 'none'; l.appendChild(i);
      document.head.appendChild(l); l.click(); l.remove();
    } catch (e) {}
  }
  function buzz(n) {
    if (navigator.vibrate) { navigator.vibrate(Array.from({ length: n * 2 - 1 }, (_, i) => i % 2 ? 80 : 60)); return; }
    for (let i = 0; i < n; i++) setTimeout(haptic, i * 140);
  }

  function banner(icon, title, msg) {
    const el = document.createElement('div');
    el.className = 'note';
    el.innerHTML = `<div class="ic ${icon}">${icon === 'set' ? '⚙️' : ''}</div>
      <div class="nb"><div class="nh"><b>${title}</b><span>now</span></div><div>${msg}</div></div>`;
    banners.prepend(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    ding(); buzz(2);
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 450); }, 3800);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !running || nagged) return;
    nagged = true;
    if (ctx) ctx.resume();
    banner('msg', 'Unknown Sender', 'closing the tab won’t save you 🙂');
  });

  // True fullscreen works on Android and iPad after a tap. iPhone Safari has no page fullscreen, so this quietly does nothing there.
  function fullscreen(on) {
    const d = document, root = d.documentElement;
    try {
      if (on && !(d.fullscreenElement || d.webkitFullscreenElement)) {
        const p = (root.requestFullscreen || root.webkitRequestFullscreen)?.call(root, { navigationUI: 'hide' });
        if (p && p.catch) p.catch(() => {});
      } else if (!on && (d.fullscreenElement || d.webkitFullscreenElement)) {
        const p = (d.exitFullscreen || d.webkitExitFullscreen)?.call(d);
        if (p && p.catch) p.catch(() => {});
      }
    } catch (e) {}
  }

  // Either button carries on; the tap is what unlocks sound and haptics. No tap within 8s carries on silently.
  function ask() {
    alertEl.hidden = false;
    return new Promise(resolve => {
      const timer = setTimeout(() => { alertEl.hidden = true; resolve('timeout'); }, 8000);
      alertEl.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          clearTimeout(timer);
          unlockAudio(); haptic(); breach(); fullscreen(true);
          alertEl.hidden = true;
          resolve(b.dataset.a);
        };
      });
    });
  }

  async function say(text, cls, hold) {
    const el = document.createElement('p');
    el.className = 'say' + (cls ? ' ' + cls : '');
    intro.appendChild(el);
    for (const ch of text) { el.textContent += ch; await sleep(32); }
    await sleep(hold);
  }

  async function callout() {
    intro.innerHTML = '<p class="bro">bro.</p>';
    intro.hidden = false;
    await sleep(1100);
    if (repeat) {
      await say('you scanned it AGAIN?', '', 1000);
      await say('you really don’t learn.', '', 900);
      await say('fine. round two.', 'red', 900);
    } else {
      await say('why did you just open a phishing link?', '', 1100);
      await say(`nice ${device()} btw.`, '', 800);
      await say('you know imma hack it now, right?', 'red', 900);
    }
  }

  const el = (tag, cls, text) => { const n = document.createElement(tag); n.className = cls; if (text) n.textContent = text; return n; };

  // The "i miss you" text, played out in a fake Messages thread.
  async function messages() {
    const imsg = document.getElementById('imsg'), thread = document.getElementById('im-thread');
    const input = document.getElementById('im-input'), send = document.getElementById('im-send');
    thread.querySelectorAll('.bub, .im-status, .typing').forEach(n => n.remove());
    document.getElementById('im-time').textContent = clock();
    input.textContent = ''; send.hidden = true;
    imsg.hidden = false;
    await sleep(800);
    for (const ch of 'i miss you') { input.textContent += ch; keyClick(); await sleep(110 + Math.random() * 90); }
    send.hidden = false;
    await sleep(500);
    input.textContent = ''; send.hidden = true;
    thread.append(el('div', 'bub me', 'i miss you'));
    swoosh();
    await sleep(700);
    const status = el('div', 'im-status', 'Delivered');
    thread.append(status);
    await sleep(1400);
    status.innerHTML = `<b>Read</b> ${clock()}`;
    await sleep(900);
    const typing = el('div', 'typing');
    typing.innerHTML = '<i></i><i></i><i></i>';
    thread.append(typing);
    await sleep(2200);
    typing.remove();
    thread.append(el('div', 'bub them', 'wait… really?'));
    received(); buzz(1);
    await sleep(2000);
    imsg.hidden = true;
  }

  // Shattered-glass overlay: jagged rays from a random impact point, joined by broken rings.
  function crack() {
    const w = innerWidth, h = innerHeight, cx = w * (.3 + Math.random() * .4), cy = h * (.4 + Math.random() * .3);
    const rays = 14, rings = [], f = n => n.toFixed(1);
    let d = '';
    for (let i = 0; i < rays; i++) {
      const a = i / rays * Math.PI * 2 + Math.random() * .35, len = Math.max(w, h) * (.5 + Math.random() * .7);
      let path = `M${f(cx)} ${f(cy)}`;
      const pts = [];
      for (let s = 1; s <= 9; s++) {
        const r = len * (s / 9) ** 1.4, aa = a + (Math.random() - .5) * .22;
        const x = cx + Math.cos(aa) * r, y = cy + Math.sin(aa) * r;
        path += ` L${f(x)} ${f(y)}`;
        pts.push([x, y]);
      }
      d += path + ' ';
      rings.push(pts);
    }
    for (const s of [0, 1, 2, 4]) {
      for (let i = 0; i < rays; i++) {
        if (Math.random() < .3) continue;
        const p = rings[i][s], q = rings[(i + 1) % rays][s];
        d += `M${f(p[0])} ${f(p[1])} L${f(q[0])} ${f(q[1])} `;
      }
    }
    const c = document.getElementById('crack');
    c.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="3" transform="translate(1 1)"/>
      <path d="${d}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.2" stroke-linejoin="bevel"/>
      <circle cx="${f(cx)}" cy="${f(cy)}" r="14" fill="rgba(255,255,255,.18)"/>
      <circle cx="${f(cx)}" cy="${f(cy)}" r="5" fill="rgba(255,255,255,.6)"/></svg>`;
    c.hidden = false;
  }

  async function line(html, cls, delay) {
    const el = document.createElement('span');
    el.className = 'l' + (cls ? ' ' + cls : '');
    el.innerHTML = html;
    term.querySelectorAll('.cursor').forEach(c => c.classList.remove('cursor'));
    el.classList.add('cursor');
    term.appendChild(el);
    chirp();
    window.scrollTo(0, document.body.scrollHeight);
    await sleep(delay ?? 350);
    return el;
  }

  // Label on its own line so long labels never squeeze the bar on a narrow iPhone screen.
  async function progress(label, ms) {
    await line(`${ts()} ${label}`, '', 150);
    const el = await line(`<span class="bar"><i></i></span><b>0%</b>`, '', 50);
    const fill = el.querySelector('i'), pct = el.querySelector('b');
    const steps = 20;
    for (let i = 1; i <= steps; i++) {
      await sleep(ms / steps);
      const p = Math.round(i / steps * 100);
      fill.style.width = p + '%';
      pct.textContent = p + '%';
      blip(p);
    }
  }

  async function storage(ms) {
    await line(`${ts()} filling your storage with pumpkin pics 🎃`, '', 150);
    const el = await line(`<span class="bar store"><i></i></span><b>0.0 / 128 GB</b>`, '', 50);
    const fill = el.querySelector('i'), gb = el.querySelector('b');
    const steps = 20;
    for (let i = 1; i <= steps; i++) {
      await sleep(ms / steps);
      const p = i / steps * 100;
      fill.style.clipPath = `inset(0 ${100 - p}% 0 0)`;
      gb.textContent = `${(p / 100 * 128).toFixed(1)} / 128 GB`;
      blip(p);
    }
  }

  async function run() {
    running = true; nagged = false;
    term.innerHTML = '';
    reveal.hidden = true;
    term.hidden = true;
    window.scrollTo(0, 0);

    await callout();
    const choice = await ask();
    intro.hidden = true;
    term.hidden = false;
    window.scrollTo(0, 0);

    await line({
      close: `${ts()} relax, your battery's fine. <span class="w">that popup was me.</span>`,
      lowpower: `${ts()} low power mode <span class="w">won't save you.</span>`,
      timeout: `${ts()} <span class="w">too slow.</span> already in.`,
    }[choice], '', 900);

    const place = await Promise.race([placeP, sleep(1500).then(() => null)]);
    const hour = new Date().getHours();
    const day = new Date().toLocaleDateString('en-US', { weekday: 'long' });
    await line(`${ts()} target: <span class="ok">${model()}</span> · ${browser()}`, '', 700);
    if (place) await line(`${ts()} location: near <span class="ok">${esc(place)}</span>`, '', 800);
    await line(`${ts()} local time: ${clock()}, ${day}${hour >= 22 || hour < 5 ? ' <span class="w">(why are you scanning shirts rn)</span>' : ''}`, '', 700);
    await line(`${ts()} language: ${esc(language())}`, '', 500);
    await line(`${ts()} display: ${matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark mode <span class="k">(respect)</span>' : 'light mode <span class="w">(bold choice)</span>'}`, '', 700);
    await line(`${ts()} bypassing Face ID ...... <span class="ok">OK</span>`, '', 600);

    await progress('looking through your ChatGPT history', 1500);
    await line(`${ts()} <span class="w">found:</span> "how to tell if someone likes you back" (x${13 + visits})`, '', 1300);
    await progress('uploading texts from mom to insta story', 1600);
    await line(`${ts()} <span class="ok">posted.</span> 23 views already`, '', 500);
    banner('msg', 'Mom ❤️', 'why is our convo on your story??');
    await sleep(1200);
    await progress('opening messages → ur ex', 1100);
    await sleep(400);
    await messages();
    await line(`${ts()} sent: <span class="w">"i miss you"</span> · <span class="b">read</span> · they replied. good luck.`, '', 1000);
    await storage(1600);
    banner('set', 'iPhone Storage Full', 'You can manage your storage in Settings.');
    await sleep(1000);
    await line(`<span class="b big">!!! DEVICE COMPROMISED !!!</span>`, '', 300);

    themeColor.content = '#ff4d4d';
    compromised(); glass(); buzz(6);
    crack();
    document.body.classList.add('glitch');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    await sleep(1300);
    document.body.classList.remove('glitch');
    await sleep(reduced ? 300 : 2000);
    themeColor.content = '#050806';

    powerDown();
    await sleep(900);
    const locked = document.getElementById('locked');
    locked.hidden = false;
    buzz(1);
    await sleep(3800);
    locked.hidden = true;
    document.getElementById('crack').hidden = true;

    await line(``, '', 300);
    await line(`${ts()} ...`, '', 1200);
    await line(`${ts()} ok wait`, '', 1100);

    const n = await Promise.race([victimP, sleep(1000).then(() => null)]);
    const victim = document.getElementById('victim');
    victim.textContent = n ? (repeat ? `still victim #${n}. you’re in the records now.` : `you’re victim #${n}.`) : '';
    victim.hidden = !n;

    fullscreen(false);
    term.hidden = true;
    reveal.hidden = false;
    running = false;
    repeat = true;
    window.scrollTo(0, 0);
  }

  document.getElementById('again').addEventListener('click', () => run());

  run();
})();
</script>
